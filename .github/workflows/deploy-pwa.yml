name: Deploy PWA to Vercel

on:
  push:
    branches:
      - main
    paths:
      - 'lifeflow-pwa/**'
      - '.github/workflows/deploy-pwa.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./lifeflow-pwa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./lifeflow-pwa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve VITE_API_BASE
        id: api_base
        run: |
          BASE="${{ vars.VITE_API_BASE }}"
          if [ -z "$BASE" ]; then
            BASE="${{ secrets.VITE_API_BASE }}"
            echo "Using secrets.VITE_API_BASE"
          else
            echo "Using vars.VITE_API_BASE"
          fi
          echo "Resolved VITE_API_BASE length: ${#BASE}"
          echo "value=$BASE" >> $GITHUB_OUTPUT

      - name: Validate VITE_API_BASE
        run: |
          BASE="${{ steps.api_base.outputs.value }}"
          echo "VITE_API_BASE=$BASE"
          if [ -z "$BASE" ]; then
            echo "Error: VITE_API_BASE is not set (check GitHub Variable or Secret)"
            exit 1
          fi
          if echo "$BASE" | grep -q "localhost"; then
            echo "Error: VITE_API_BASE contains localhost: $BASE"
            exit 1
          fi

      - name: Write production env
        run: |
          echo "VITE_API_BASE=${{ steps.api_base.outputs.value }}" > .env.production
          echo "Build-time VITE_API_BASE: ${{ steps.api_base.outputs.value }}"

      - name: Build PWA
        run: npm run build
        env:
          VITE_API_BASE: ${{ steps.api_base.outputs.value }}

      - name: Verify bundle does not contain localhost
        run: |
          if grep -R "http://localhost:8787" dist/ 2>/dev/null; then
            echo "Error: built bundle still contains localhost API base"
            exit 1
          fi
          echo "Bundle API base OK"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VITE_API_BASE: ${{ steps.api_base.outputs.value }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
